# =============================================================================
# GNSS bike computer - Zephyr configuration (docs/16-arquitetura-firmware.md)
# =============================================================================

CONFIG_WARN_EXPERIMENTAL=n

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------
# main() reads the settings (ZMS or NVS) before the services start
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_USE_MODULE=n
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y

# -----------------------------------------------------------------------------
# Logging on the UART console
# -----------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=n

# -----------------------------------------------------------------------------
# Buses (drivers come from the devicetree)
# -----------------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_API=y

# -----------------------------------------------------------------------------
# Events and state machines (docs/16, Eventos and Máquinas de estado)
# -----------------------------------------------------------------------------
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y

# -----------------------------------------------------------------------------
# Threads
# -----------------------------------------------------------------------------
CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10
CONFIG_THREAD_ANALYZER=n
CONFIG_THREAD_NAME=y

# -----------------------------------------------------------------------------
# Watchdog: one 4 s channel per service thread (seven), backed by the nRF WDT.
# The legacy used one 4 s channel fed by the boucle and LCD tasks. A minimum
# timeout equal to the channels keeps the kernel timer from waking every
# 100 ms.
# -----------------------------------------------------------------------------
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_MIN_TIMEOUT=4000
CONFIG_TASK_WDT_CHANNELS=8

# -----------------------------------------------------------------------------
# Power: System OFF when the device turns off without the PMIC ship mode
# -----------------------------------------------------------------------------
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y

# -----------------------------------------------------------------------------
# GNSS: the receiver of the alias gnss through the Zephyr GNSS API
# -----------------------------------------------------------------------------
CONFIG_GNSS=y
CONFIG_GNSS_SATELLITES=y
# The GNSS drivers parse and call the service callbacks in the modem work
# queue; they publish on zbus (about 0.9 KB with the parser), too much for the
# 1 KB system work queue
CONFIG_MODEM_DEDICATED_WORKQUEUE=y
CONFIG_MODEM_DEDICATED_WORKQUEUE_STACK_SIZE=2048

# -----------------------------------------------------------------------------
# Sensors (aliases baro0, imu0, mag0, light0)
# -----------------------------------------------------------------------------
CONFIG_SENSOR=y

# -----------------------------------------------------------------------------
# Card: FatFs on the SD of the devicetree (disk "SD"), long names in a static
# buffer (no allocation after boot)
# -----------------------------------------------------------------------------
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y

# -----------------------------------------------------------------------------
# Bluetooth Low Energy
# -----------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="stravaV10"
# 0x0481 Cycling: Cycling Computer (1157 = 0x0485 is Speed and Cadence Sensor)
CONFIG_BT_DEVICE_APPEARANCE=1153
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_DIS=y
CONFIG_BT_BAS=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_SETTINGS=y
# The sensor clients publish on zbus from the receive thread (about 0.45 KB
# more than the stack's own use)
CONFIG_BT_RX_STACK_SIZE=3072

# -----------------------------------------------------------------------------
# Settings (the nRF54LM20 targets switch to ZMS in their board .conf)
# -----------------------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# -----------------------------------------------------------------------------
# Faults and debug
# -----------------------------------------------------------------------------
CONFIG_CMSIS_DSP=n
CONFIG_DEBUG=n
CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_ASSERT=n
CONFIG_FAULT_DUMP=1
# Log the fatal error and reboot (NCS lib/fatal_error) instead of halting
CONFIG_RESET_ON_FATAL_ERROR=y
# Reset cause for crash_recovery through the Zephyr hwinfo API
CONFIG_HWINFO=y

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_SPEED_OPTIMIZATIONS=n
