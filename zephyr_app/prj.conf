# =============================================================================
# stravaV10 - Zephyr Project Configuration
# Bike GPS Computer with Strava Segments
# =============================================================================

# Disable Kconfig warnings as errors (NCS 3.1 compatibility)
CONFIG_WARN_EXPERIMENTAL=n

# -----------------------------------------------------------------------------
# General Configuration
# -----------------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_USE_MODULE=n
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y

# -----------------------------------------------------------------------------
# Logging - Using UART backend (RTT has compatibility issues with NCS 3.1)
# -----------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=n

# -----------------------------------------------------------------------------
# GPIO
# -----------------------------------------------------------------------------
CONFIG_GPIO=y

# -----------------------------------------------------------------------------
# SPI - LCD LS027 and SD Card
# -----------------------------------------------------------------------------
CONFIG_SPI=y
# SPI_NRFX auto-selected from devicetree

# -----------------------------------------------------------------------------
# I2C - Sensors (Barometer, Accelerometer, Fuel Gauge)
# -----------------------------------------------------------------------------
CONFIG_I2C=y
# I2C_NRFX auto-selected from devicetree

# -----------------------------------------------------------------------------
# UART - GPS Module
# -----------------------------------------------------------------------------
CONFIG_SERIAL=y
# UART_NRFX auto-selected from devicetree
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_API=y
# RX ring buffer between the GPS UART ISR and main_loop (hal_uart.c)
CONFIG_RING_BUFFER=y

# -----------------------------------------------------------------------------
# Bluetooth Low Energy
# -----------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="stravaV10"
CONFIG_BT_DEVICE_APPEARANCE=1157
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4

# BT Services
CONFIG_BT_DIS=y
CONFIG_BT_BAS=y

# BT GATT Client (for HRS, BSC, FEC sensors)
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y

# BT Settings
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# -----------------------------------------------------------------------------
# Display
# -----------------------------------------------------------------------------
# Note: Display driver will be custom (Sharp LS027), not Zephyr display subsystem
# CONFIG_DISPLAY=y

# -----------------------------------------------------------------------------
# File System - SD Card via SPI
# -----------------------------------------------------------------------------
# Note: nRF52840 does NOT have native SDMMC controller
# SD Card must use SPI interface with sdhc driver
# Temporarily disabled until devicetree is configured with SD card node
# -----------------------------------------------------------------------------
# CONFIG_FILE_SYSTEM=y
# CONFIG_FAT_FILESYSTEM_ELM=y
# CONFIG_FS_FATFS_LFN=y
# CONFIG_FS_FATFS_LFN_MODE_HEAP=y
# CONFIG_DISK_ACCESS=y
# CONFIG_SDHC=y
# CONFIG_SPI_SDHC=y

# -----------------------------------------------------------------------------
# Threads and Synchronization
# -----------------------------------------------------------------------------
CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10

# Thread Analyzer (debug)
CONFIG_THREAD_ANALYZER=n
CONFIG_THREAD_NAME=y

# -----------------------------------------------------------------------------
# Timers and Counters
# -----------------------------------------------------------------------------
# CONFIG_COUNTER=y  # Requires counter device in devicetree

# -----------------------------------------------------------------------------
# Watchdog
# -----------------------------------------------------------------------------
CONFIG_WATCHDOG=y
# WDT_NRFX is auto-selected based on devicetree

# -----------------------------------------------------------------------------
# Power Management
# -----------------------------------------------------------------------------
# CONFIG_PM=y disabled - requires SYS_CLOCK_EXISTS && HAS_PM on nRF52840
CONFIG_PM_DEVICE=y

# -----------------------------------------------------------------------------
# USB Device Stack - Disabled (requires devicetree zephyr,cdc-acm-uart node)
# -----------------------------------------------------------------------------
# CONFIG_USB_DEVICE_STACK=y
# CONFIG_USB_CDC_ACM=y

# -----------------------------------------------------------------------------
# Sensors Subsystem
# -----------------------------------------------------------------------------
CONFIG_SENSOR=y

# -----------------------------------------------------------------------------
# Math Library
# -----------------------------------------------------------------------------
CONFIG_CMSIS_DSP=n

# -----------------------------------------------------------------------------
# Debug Configuration
# -----------------------------------------------------------------------------
CONFIG_DEBUG=n
CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_ASSERT=n

# Fault handling
CONFIG_FAULT_DUMP=1
# Log the fatal error and reboot (NCS lib/fatal_error) instead of halting:
# without it a stack overflow or bus fault freezes the device until power-off.
CONFIG_RESET_ON_FATAL_ERROR=y

# -----------------------------------------------------------------------------
# Build Configuration
# -----------------------------------------------------------------------------
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_SPEED_OPTIMIZATIONS=n
