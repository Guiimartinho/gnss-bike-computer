# =============================================================================
# GNSS bike computer - Zephyr configuration (docs/16-arquitetura-firmware.md)
# =============================================================================

CONFIG_WARN_EXPERIMENTAL=n

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------
# main() reads the settings (ZMS or NVS) before the services start
CONFIG_MAIN_STACK_SIZE=2048
# The serial VCOM of the display (myStravaB V3) sends its command from the
# system work queue: about 1 KB with the SPI and a log (docs/05, Pilhas)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_USE_MODULE=n
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y

# -----------------------------------------------------------------------------
# Logging on the UART console
# -----------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=n

# -----------------------------------------------------------------------------
# Buses (drivers come from the devicetree)
# -----------------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_API=y

# -----------------------------------------------------------------------------
# Events and state machines (docs/16, Eventos and Máquinas de estado)
# -----------------------------------------------------------------------------
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y

# -----------------------------------------------------------------------------
# Threads
# -----------------------------------------------------------------------------
CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10
CONFIG_THREAD_ANALYZER=n
CONFIG_THREAD_NAME=y

# -----------------------------------------------------------------------------
# Watchdog: one 4 s channel per service thread (seven), backed by the nRF WDT.
# The legacy used one 4 s channel fed by the boucle and LCD tasks. A minimum
# timeout equal to the channels keeps the kernel timer from waking every
# 100 ms.
# -----------------------------------------------------------------------------
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_MIN_TIMEOUT=4000
CONFIG_TASK_WDT_CHANNELS=10

# -----------------------------------------------------------------------------
# Power: System OFF when the device turns off without the PMIC ship mode; the
# fuel gauge of the alias fuel-gauge0 (MAX17262, driver in modules/gnss_drivers)
# -----------------------------------------------------------------------------
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y
CONFIG_FUEL_GAUGE=y

# -----------------------------------------------------------------------------
# GNSS: the receiver of the alias gnss through the Zephyr GNSS API
# -----------------------------------------------------------------------------
CONFIG_GNSS=y
CONFIG_GNSS_SATELLITES=y
# The GNSS drivers parse and call the service callbacks in the modem work
# queue; they publish on zbus (about 0.9 KB with the parser), apart from the
# system work queue
CONFIG_MODEM_DEDICATED_WORKQUEUE=y
CONFIG_MODEM_DEDICATED_WORKQUEUE_STACK_SIZE=2048

# -----------------------------------------------------------------------------
# Sensors (aliases baro0, imu0, mag0, light0)
# -----------------------------------------------------------------------------
CONFIG_SENSOR=y

# -----------------------------------------------------------------------------
# Display and interface (docs/18): the memory-in-pixel panel of the chosen
# node zephyr,display (driver in modules/gnss_drivers) and the LVGL screens of
# src/ui, drawn by the ui thread only. The LVGL options mirror
# tests/ui/lv_conf.h, so the host renderer draws what the panel shows.
# -----------------------------------------------------------------------------
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_DPI_DEF=173
# Objects, styles and texts: 23.9 KB at most on the PC with 64-bit pointers
# (tools/ui/render_screens.py), less with the 32-bit ones of the nRF
CONFIG_LV_Z_MEM_POOL_SIZE=32768
# Rendering buffer: 10 % of the screen, 19,200 B (static). The bits per pixel
# of the buffer default to 32 whatever the colour depth (the first default of
# zephyr/modules/lvgl/Kconfig.memory wins), which doubles it
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_USE_FILESYSTEM=n
# RGB565 is the only picture format; A8 stays for the masks of the letters.
# With the others off the host renderer draws the same 58 pictures, byte for
# byte, and the firmware saves about 34 KB of flash
CONFIG_LV_DRAW_SW_SUPPORT_RGB565_SWAPPED=n
CONFIG_LV_DRAW_SW_SUPPORT_RGB565A8=n
CONFIG_LV_DRAW_SW_SUPPORT_RGB888=n
CONFIG_LV_DRAW_SW_SUPPORT_XRGB8888=n
CONFIG_LV_DRAW_SW_SUPPORT_ARGB8888=n
CONFIG_LV_DRAW_SW_SUPPORT_ARGB8888_PREMULTIPLIED=n
CONFIG_LV_DRAW_SW_SUPPORT_L8=n
CONFIG_LV_DRAW_SW_SUPPORT_AL88=n
CONFIG_LV_DRAW_SW_SUPPORT_I1=n
# No LVGL log in the firmware: lv_log_add() alone takes 848 B deep in the
# drawing chain; the host renderer keeps it on and runs the same screens
CONFIG_LV_USE_LOG=n
# The interface brings its 1-bit fonts and sets one on every label
CONFIG_LV_FONT_MONTSERRAT_14=n
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y
CONFIG_LV_USE_THEME_DEFAULT=n
CONFIG_LV_USE_THEME_SIMPLE=n
CONFIG_LV_USE_THEME_MONO=n
# Widgets: labels on plain objects; the rest stays out
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_ANIMIMG=n
CONFIG_LV_USE_ARC=n
CONFIG_LV_USE_ARCLABEL=n
CONFIG_LV_USE_BAR=n
CONFIG_LV_USE_BUTTON=n
CONFIG_LV_USE_BUTTONMATRIX=n
CONFIG_LV_USE_CALENDAR=n
CONFIG_LV_USE_CANVAS=n
CONFIG_LV_USE_CHART=n
CONFIG_LV_USE_CHECKBOX=n
CONFIG_LV_USE_DROPDOWN=n
CONFIG_LV_USE_IMAGEBUTTON=n
CONFIG_LV_USE_KEYBOARD=n
CONFIG_LV_USE_LED=n
CONFIG_LV_USE_LINE=n
CONFIG_LV_USE_LIST=n
CONFIG_LV_USE_MENU=n
CONFIG_LV_USE_MSGBOX=n
CONFIG_LV_USE_ROLLER=n
CONFIG_LV_USE_SCALE=n
CONFIG_LV_USE_SLIDER=n
CONFIG_LV_USE_SPAN=n
CONFIG_LV_USE_SPINBOX=n
CONFIG_LV_USE_SPINNER=n
CONFIG_LV_USE_SWITCH=n
CONFIG_LV_USE_TEXTAREA=n
CONFIG_LV_USE_TABLE=n
CONFIG_LV_USE_TABVIEW=n
CONFIG_LV_USE_TILEVIEW=n
CONFIG_LV_USE_WIN=n
# Keys: gpio-keys and zephyr,input-longpress (node label longpress). The
# key callback publishes on zbus from the input thread: about 0.9 KB
CONFIG_INPUT=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# -----------------------------------------------------------------------------
# Card: FatFs on the SD of the devicetree (disk "SD"), long names in a static
# buffer (no allocation after boot)
# -----------------------------------------------------------------------------
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y

# -----------------------------------------------------------------------------
# Bluetooth Low Energy
# -----------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="stravaV10"
# 0x0481 Cycling: Cycling Computer (1157 = 0x0485 is Speed and Cadence Sensor)
CONFIG_BT_DEVICE_APPEARANCE=1153
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_DIS=y
CONFIG_BT_BAS=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_SETTINGS=y
# The sensor clients publish on zbus from the receive thread (about 0.45 KB
# more than the stack's own use)
CONFIG_BT_RX_STACK_SIZE=3072

# -----------------------------------------------------------------------------
# Settings (the nRF54LM20 targets switch to ZMS in their board .conf)
# -----------------------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# -----------------------------------------------------------------------------
# Faults and debug
# -----------------------------------------------------------------------------
CONFIG_CMSIS_DSP=n
CONFIG_DEBUG=n
CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_ASSERT=n
CONFIG_FAULT_DUMP=1
# Log the fatal error and reboot (NCS lib/fatal_error) instead of halting
CONFIG_RESET_ON_FATAL_ERROR=y
# Reset cause for crash_recovery through the Zephyr hwinfo API
CONFIG_HWINFO=y

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_SPEED_OPTIMIZATIONS=n
