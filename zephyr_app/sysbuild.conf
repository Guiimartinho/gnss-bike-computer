# Sysbuild do zephyr_app (NCS v3.3.0).
#
# O Partition Manager está depreciado no NCS 3.3 em favor das partições do
# devicetree. Desligado, o layout da flash é o do nrf52840dk: aplicação a
# partir de 0x0 e storage_partition (settings/NVS) de 32 KB em 0xF8000, o
# mesmo dos builds antigos sem sysbuild.
SB_CONFIG_PARTITION_MANAGER=n
