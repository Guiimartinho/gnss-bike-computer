# GNSS Bike Computer (gnssbike/nrf54lm20a/cpuapp), merged after prj.conf.
#
# The board of the project. It carries the same nRF54LM20A as the DK it is
# developed on, so most of this is the DK's file; what differs is written
# where it differs.
# The nRF54L non-volatile memory is RRAM: no erase, and Nordic recommends
# ZMS instead of NVS on it. The settings subsystem (bonds, user settings)
# then uses the ZMS backend; the application code does not change.
CONFIG_NVS=n
CONFIG_ZMS=y
# prj.conf picks SETTINGS_NVS for the nRF52840; pick the ZMS backend here
CONFIG_SETTINGS_ZMS=y

# The display light, the buzzer and the RGB indicator, all by PWM
CONFIG_PWM=y
# nPM1300 regulators: ship mode, the locked rails, the light supply
CONFIG_REGULATOR=y
#
# The GNSS runs from BUCK1 of the nPM1300, and its node says so with
# vcc-supply. A driver that takes a supply has to start after the regulator
# that gives it: Zephyr checks this at link time and the build fails
# otherwise. The regulator of the nPM1300 lands on POST_KERNEL+32, so the
# receiver goes after it: the regulator of the nPM1300 sits at 86, so 90.
CONFIG_GNSS_INIT_PRIORITY=90
# AEM10900 solar charger by the charger API
CONFIG_CHARGER=y

# --- Update over the air (DFU): mcumgr SMP over Bluetooth -------------------
#
# The nRF54LM20A leaves 920 KB per image slot, which is what makes an update
# over the air possible at all (Kconfig.sysbuild). The numbers below are the ones of the official
# smp_svr sample (zephyr/samples/subsys/mgmt/mcumgr/smp_svr/bt.conf), which
# splits one SMP packet into five Bluetooth writes of 498 bytes.
CONFIG_MCUMGR=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
# img_mgmt.h pulls bootutil/image.h: the chain-loaded side of MCUboot
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# The hooks src/rf/dfu.c hangs on: progress for the screen and the right to
# refuse an upload that would cost the rider a ride or the battery.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y

# --- Storage: soldered SPI NOR instead of a card ---------------------------
#
# This board has no card socket (decision of the owner in 2026-09-20): FatFs
# runs over a flash disk on the soldered NOR part, which keeps the mount
# point /SD: and lets the USB mass storage hand the same disk to the PC.
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_SDMMC_SUBSYS=n
# a blank part is formatted at the first mount (the card came formatted)
CONFIG_FS_FATFS_MKFS=y
CONFIG_FILE_SYSTEM_MKFS=y

# --- USB: serial of the commands and the disk on the PC --------------------
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DRIVER=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
# the serial of the commands is not the console: it opens with the service
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# --- Routes and segments: this board has RAM to spare ----------------------
#
# 4000 points hold a hundred kilometres with one point every 25 m, which is
# what Strava and Komoot export, against the one every 200 m that the 500 of
# the old board would leave: 4000 x 16 B = 64 KB. The segments keep 768 each,
# so the longest of tools/TDD/DB (1291 points) comes in at one point every
# 16 m or so, which is finer than the 50 m of the activation rule.
CONFIG_GNSS_ROUTE_POINTS=4000
CONFIG_GNSS_SEGMENT_POINTS=768

# --- Files over Bluetooth: the phone sends a course -------------------------
#
# The file group of mcumgr rides on the same SMP link as the update, so the
# phone can put a route on the device; what a transfer may touch is decided
# by src/rf/file_xfer.c with the rules of model/file_policy.c.
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=y
CONFIG_MCUMGR_GRP_FS_CHECKSUM_HASH=y
CONFIG_MCUMGR_GRP_FS_CHECKSUM_IEEE_CRC32=y
CONFIG_MCUMGR_GRP_FS_FILE_STATUS=y
