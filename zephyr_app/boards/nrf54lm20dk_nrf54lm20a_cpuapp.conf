# nRF54LM20 DK (nrf54lm20dk/nrf54lm20a/cpuapp), merged after prj.conf.
#
# The nRF54L non-volatile memory is RRAM: no erase, and Nordic recommends
# ZMS instead of NVS on it. The settings subsystem (bonds, user settings)
# then uses the ZMS backend; the application code does not change.
CONFIG_NVS=n
CONFIG_ZMS=y
# prj.conf picks SETTINGS_NVS for the nRF52840; pick the ZMS backend here
CONFIG_SETTINGS_ZMS=y

# The display light by PWM (alias backlight: LED 1 of the DK stands for it)
CONFIG_PWM=y
# nPM1300 regulators: ship mode, the locked rails, the light supply
CONFIG_REGULATOR=y
# AEM10900 solar charger by the charger API
CONFIG_CHARGER=y

# --- Update over the air (DFU): mcumgr SMP over Bluetooth -------------------
#
# Only this board takes it: the nRF54LM20A leaves 920 KB per image slot,
# while the nRF52840 leaves 481 KB against a firmware of 479 KB
# (Kconfig.sysbuild). The numbers below are the ones of the official
# smp_svr sample (zephyr/samples/subsys/mgmt/mcumgr/smp_svr/bt.conf), which
# splits one SMP packet into five Bluetooth writes of 498 bytes.
CONFIG_MCUMGR=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
# img_mgmt.h pulls bootutil/image.h: the chain-loaded side of MCUboot
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# The hooks src/rf/dfu.c hangs on: progress for the screen and the right to
# refuse an upload that would cost the rider a ride or the battery.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y
